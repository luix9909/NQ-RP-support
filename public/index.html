<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدعم الفني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#08111a; --bg-1:#0d1a26; --bg-2:#132433; --line:#1f3547;
  --teal:#14b8a6; --teal-2:#5eead4; --teal-dim:#0b6b60;
  --text-0:#eaf3f5; --text-1:#9db3bd; --text-2:#5c7784;
  --red:#ef4444; --green:#22c55e; --amber:#eab308;
  --font:'Cairo',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--font);background:var(--bg-0);color:var(--text-0);}
.hidden{display:none !important;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
::selection{background:var(--teal);color:#000;}

.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{width:480px;max-width:100%;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.brand{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--line);}
.brand .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(160deg,var(--teal-2),var(--teal-dim));display:flex;align-items:center;justify-content:center;font-size:17px;}
.brand b{font-size:15px;}
.brand span{display:block;font-family:var(--mono);font-size:10px;color:var(--text-2);letter-spacing:1px;}
.pad{padding:24px;}

/* Intake form */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--text-1);margin-bottom:7px;}
.field input, .field textarea{width:100%;background:var(--bg-0);border:1px solid var(--line);border-radius:9px;padding:12px 14px;color:var(--text-0);font-size:14px;outline:none;}
.field textarea{min-height:90px;resize:vertical;}
.field input:focus, .field textarea:focus{border-color:var(--teal-dim);}
.primary-btn{width:100%;background:linear-gradient(180deg,var(--teal-2),var(--teal));color:#022; font-weight:700;padding:14px;border-radius:10px;font-size:14.5px;}
.primary-btn:hover{filter:brightness(1.06);}
.err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:14px;}

/* Queue view */
.queue-view{padding:36px 24px;text-align:center;}
.queue-num{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--teal-2);line-height:1;}
.queue-label{font-size:13px;color:var(--text-1);margin:10px 0 26px;}
.eta-box{background:var(--bg-0);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px;}
.eta-box .t{font-family:var(--mono);font-size:20px;color:var(--text-0);}
.eta-box .l{font-size:11.5px;color:var(--text-2);margin-top:4px;}
.hold-music-row{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12.5px;color:var(--text-2);}
.hold-music-row button{border:1px solid var(--line);border-radius:8px;padding:6px 12px;}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.3s infinite;display:inline-block;margin-inline-end:6px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Chat view */
#chat-view{display:flex;flex-direction:column;height:640px;max-height:85vh;}
.chat-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.chat-head .agent{font-size:13px;}
.chat-head .agent b{color:var(--teal-2);}
.call-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;}
.call-btn.active{background:var(--red);border-color:var(--red);}
#chat-scroll{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
.bubble-row{display:flex;}
.bubble-row.mine{justify-content:flex-start;}
.bubble-row.theirs{justify-content:flex-end;}
.bubble-row.system{justify-content:center;}
.bubble{max-width:75%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;}
.bubble-row.mine .bubble{background:var(--teal-dim);color:#eafffb;border-radius:12px 12px 12px 2px;}
.bubble-row.theirs .bubble{background:var(--bg-2);border:1px solid var(--line);border-radius:12px 12px 2px 12px;}
.bubble-row.system .bubble{background:none;color:var(--text-2);font-size:11.5px;font-family:var(--mono);}
.bubble img,.bubble video{max-width:100%;border-radius:8px;display:block;margin-top:6px;}
.bubble audio{margin-top:6px;width:220px;}
.typing-preview{padding:6px 20px;font-size:11.5px;color:var(--text-2);font-family:var(--mono);min-height:20px;}
#chat-form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center;}
#chat-input{flex:1;background:var(--bg-0);border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:var(--text-0);font-size:13.5px;outline:none;}
#chat-input:focus{border-color:var(--teal-dim);}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-1);}
.icon-btn:hover{color:var(--teal-2);border-color:var(--teal-dim);}
#send-btn{background:var(--teal);color:#022;font-weight:700;padding:0 16px;border-radius:9px;height:38px;}

/* Closed banner */
.closed-banner{margin:14px 20px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-0);text-align:center;font-size:13px;}
.closed-banner.approved{border-color:var(--green);color:var(--green);}
.closed-banner.rejected{border-color:var(--red);color:var(--red);}
.closed-banner .sol{color:var(--text-1);margin-top:6px;font-size:12.5px;}

.incoming-call{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-1);border:1px solid var(--teal);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;}
.incoming-call button{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;}
.incoming-call .accept{background:var(--green);color:#001;}
.incoming-call .decline{background:var(--red);color:#fff;}
</style>
</head>
<body>

<div class="shell">
  <div class="card">
    <div class="brand">
      <div class="mark">🎧</div>
      <div><b>الدعم الفني</b><span>SUPPORT DESK</span></div>
    </div>

    <!-- Intake form -->
    <div id="intake-view" class="pad">
      <div class="field"><label>الاسم</label><input id="in-name" placeholder="اسمك الكامل"></div>
      <div class="field"><label>رقم التواصل (اختياري)</label><input id="in-contact" placeholder="رقم جوال أو إيميل"></div>
      <div class="field"><label>تفاصيل طلبك</label><textarea id="in-subject" placeholder="اشرح مشكلتك أو طلبك بالتفصيل..."></textarea></div>
      <button class="primary-btn" id="intake-submit">إرسال الطلب</button>
      <div class="err" id="intake-err"></div>
    </div>

    <!-- Queue waiting view -->
    <div id="queue-view" class="queue-view hidden">
      <div class="queue-num" id="queue-pos">—</div>
      <div class="queue-label"><span class="pulse-dot"></span>دورك بالطابور</div>
      <div class="eta-box">
        <div class="t" id="eta-text">—</div>
        <div class="l">الوقت المتوقع للانتظار (تقديري)</div>
      </div>
      <div class="hold-music-row">
        <span>🎵 موسيقى الانتظار</span>
        <button id="hold-toggle">إيقاف</button>
      </div>
      <audio id="hold-audio" loop></audio>
    </div>

    <!-- Active/closed chat view -->
    <div id="chat-view" class="hidden">
      <div class="chat-head">
        <div class="agent">متصل مع: <b id="agent-name">—</b></div>
        <button class="call-btn" id="call-btn" title="اتصال صوتي">🎙️</button>
      </div>
      <div id="chat-scroll"></div>
      <div class="typing-preview" id="typing-preview"></div>
      <div id="closed-area"></div>
      <form id="chat-form">
        <button type="button" class="icon-btn" id="attach-btn" title="إرفاق ملف">📎</button>
        <input type="file" id="file-input" class="hidden" accept="image/*,video/*,audio/*">
        <input id="chat-input" placeholder="اكتب رسالتك...">
        <button type="submit" id="send-btn">إرسال</button>
      </form>
    </div>
  </div>
</div>

<audio id="remote-audio" autoplay></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
let ticketId = localStorage.getItem('support_ticket_id');
let accessToken = localStorage.getItem('support_ticket_token');
let socket = null;
let pollTimer = null;
let typingTimer = null;
let pc = null;
let localStream = null;
let callActive = false;
let peerSocketId = null;

const ICE_SERVERS = [
  { urls:'stun:stun.l.google.com:19302' },
  { urls:'stun:stun.relay.metered.ca:80' },
  { urls:'turn:global.relay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject' }
];

function show(id){
  ['intake-view','queue-view','chat-view'].forEach(v=> document.getElementById(v).classList.toggle('hidden', v!==id));
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtEta(sec){
  if(sec<=0) return 'الآن';
  const m = Math.ceil(sec/60);
  return m<=1 ? 'أقل من دقيقة' : ('حوالي '+m+' دقيقة');
}

document.getElementById('intake-submit').onclick = async ()=>{
  const customerName = document.getElementById('in-name').value.trim();
  const customerContact = document.getElementById('in-contact').value.trim();
  const subject = document.getElementById('in-subject').value.trim();
  const err = document.getElementById('intake-err'); err.textContent='';
  if(!customerName){ err.textContent='الاسم مطلوب'; return; }
  if(!subject){ err.textContent='اكتب تفاصيل طلبك'; return; }
  const res = await fetch('/api/tickets', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({customerName, customerContact, subject}) });
  const data = await res.json();
  if(!res.ok){ err.textContent = data.error; return; }
  ticketId = data.id; accessToken = data.accessToken;
  localStorage.setItem('support_ticket_id', ticketId);
  localStorage.setItem('support_ticket_token', accessToken);
  boot();
};

async function boot(){
  if(!ticketId || !accessToken) return;
  const res = await fetch(`/api/tickets/${ticketId}/status?token=${accessToken}`);
  if(!res.ok){ localStorage.removeItem('support_ticket_id'); localStorage.removeItem('support_ticket_token'); show('intake-view'); return; }
  const status = await res.json();
  applyStatus(status);
  connectSocket();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    const r = await fetch(`/api/tickets/${ticketId}/status?token=${accessToken}`);
    if(r.ok) applyStatus(await r.json());
  }, 12000);
}

function applyStatus(status){
  document.getElementById('agent-name').textContent = status.assignedAdminName || '—';
  if(status.status === 'waiting'){
    show('queue-view');
    document.getElementById('queue-pos').textContent = status.position;
    document.getElementById('eta-text').textContent = fmtEta(status.etaSeconds);
    playHold();
  } else {
    stopHold();
    show('chat-view');
    if(status.status === 'closed'){
      const area = document.getElementById('closed-area');
      const cls = status.outcome === 'approved' ? 'approved' : status.outcome === 'rejected' ? 'rejected' : '';
      const label = status.outcome === 'approved' ? '✔ تم قبول طلبك' : status.outcome === 'rejected' ? '✘ تم رفض طلبك' : 'تم إغلاق الطلب';
      area.innerHTML = `<div class="closed-banner ${cls}">${label}${status.solution ? `<div class="sol">${escapeHtml(status.solution)}</div>` : ''}</div>`;
      document.getElementById('chat-form').classList.add('hidden');
      document.getElementById('call-btn').classList.add('hidden');
    }
  }
}

function playHold(){
  const a = document.getElementById('hold-audio');
  if(!a.src){ a.src = '/audio/hold-music.mp3'; }
  a.play().catch(()=>{});
}
function stopHold(){
  document.getElementById('hold-audio').pause();
}
document.getElementById('hold-toggle').onclick = ()=>{
  const a = document.getElementById('hold-audio');
  const btn = document.getElementById('hold-toggle');
  if(a.paused){ a.play().catch(()=>{}); btn.textContent='إيقاف'; }
  else { a.pause(); btn.textContent='تشغيل'; }
};

function connectSocket(){
  socket = io({ auth:{} });
  socket.on('connect', ()=> socket.emit('ticket:join', { ticketId, accessToken }));
  socket.on('ticket:history', (msgs)=>{
    document.getElementById('chat-scroll').innerHTML='';
    msgs.forEach(appendMessage);
  });
  socket.on('ticket:message', appendMessage);
  socket.on('ticket:status', applyStatus);

  socket.on('rtc:call-request', ({fromSocketId})=> showIncomingCall(fromSocketId));
  socket.on('rtc:offer', async ({fromSocketId, sdp})=>{
    peerSocketId = fromSocketId;
    await ensurePC();
    await pc.setRemoteDescription(sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('rtc:answer', { toSocketId: fromSocketId, sdp: answer });
  });
  socket.on('rtc:answer', async ({sdp})=>{ await pc?.setRemoteDescription(sdp); });
  socket.on('rtc:ice', async ({candidate})=>{ try{ await pc?.addIceCandidate(candidate); }catch(e){} });
  socket.on('rtc:call-end', endCall);
  socket.on('rtc:call-decline', ()=>{ endCall(); alert('تم رفض الاتصال'); });
}

function appendMessage(m){
  const wrap = document.getElementById('chat-scroll');
  const row = document.createElement('div');
  const mine = m.sender_type === 'customer';
  row.className = 'bubble-row ' + (m.sender_type==='system' ? 'system' : (mine ? 'mine' : 'theirs'));
  let media = '';
  if(m.attachment_url){
    if(m.attachment_type==='image') media = `<img src="${m.attachment_url}">`;
    else if(m.attachment_type==='video') media = `<video src="${m.attachment_url}" controls></video>`;
    else if(m.attachment_type==='audio') media = `<audio src="${m.attachment_url}" controls></audio>`;
  }
  row.innerHTML = `<div class="bubble">${m.content?escapeHtml(m.content):''}${media}</div>`;
  wrap.appendChild(row);
  wrap.scrollTop = wrap.scrollHeight;
}

/* typing preview (send only, customer doesn't see their own) */
document.getElementById('chat-input').addEventListener('input', (e)=>{
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=> socket?.emit('ticket:typing', { ticketId, text: e.target.value }), 250);
});

document.getElementById('chat-form').onsubmit = (e)=>{
  e.preventDefault();
  const input = document.getElementById('chat-input');
  if(!input.value.trim()) return;
  socket.emit('ticket:message', { ticketId, content: input.value });
  input.value='';
  socket.emit('ticket:typing', { ticketId, text:'' });
};

document.getElementById('attach-btn').onclick = ()=> document.getElementById('file-input').click();
document.getElementById('file-input').onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData(); fd.append('file', file);
  const res = await fetch(`/api/upload?ticketId=${ticketId}&token=${accessToken}`, { method:'POST', body: fd });
  const data = await res.json();
  if(!res.ok){ alert(data.error||'تعذر رفع الملف'); return; }
  socket.emit('ticket:message', { ticketId, content:'', attachmentUrl: data.url, attachmentType: data.type });
  e.target.value='';
};

/* ============ Voice call (1:1 WebRTC) ============ */
async function ensurePC(){
  if(pc) return;
  localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
  pc.onicecandidate = (e)=>{ if(e.candidate && peerSocketId) socket.emit('rtc:ice', { toSocketId: peerSocketId, candidate: e.candidate }); };
  pc.ontrack = (e)=>{ document.getElementById('remote-audio').srcObject = e.streams[0]; };
  callActive = true;
  document.getElementById('call-btn').classList.add('active');
}
function endCall(){
  pc?.close(); pc=null;
  localStream?.getTracks().forEach(t=>t.stop()); localStream=null;
  document.getElementById('remote-audio').srcObject = null;
  callActive = false; peerSocketId = null;
  document.getElementById('call-btn').classList.remove('active');
}
document.getElementById('call-btn').onclick = ()=>{
  if(callActive){ socket.emit('rtc:call-end', { ticketId }); endCall(); return; }
  socket.emit('rtc:call-request', { ticketId });
  alert('جاري إرسال طلب الاتصال، بانتظار قبول الموظف...');
};
function showIncomingCall(fromSocketId){
  peerSocketId = fromSocketId;
  const el = document.createElement('div');
  el.className='incoming-call';
  el.innerHTML = `<span>📞 اتصال صوتي وارد</span><button class="accept">قبول</button><button class="decline">رفض</button>`;
  document.body.appendChild(el);
  el.querySelector('.accept').onclick = async ()=>{
    el.remove();
    await ensurePC();
    socket.emit('rtc:call-accept', { toSocketId: fromSocketId });
  };
  el.querySelector('.decline').onclick = ()=>{
    el.remove();
    socket.emit('rtc:call-decline', { toSocketId: fromSocketId });
  };
}

boot();
</script>
</body>
</html>
