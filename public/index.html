<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدعم الفني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #060d14;
  --bg-1: #0b1520;
  --bg-2: #12202e;
  --bg-3: #1a2d3f;
  --line: #1e3348;
  --teal: #14b8a6;
  --teal-2: #5eead4;
  --teal-dim: #0d6b62;
  --teal-glow: rgba(20,184,166,.15);
  --text-0: #f0f7fa;
  --text-1: #a8c0cc;
  --text-2: #6b8a99;
  --red: #ef4444;
  --green: #22c55e;
  --amber: #eab308;
  --font: 'Cairo', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 16px;
  --shadow: 0 12px 40px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-0);
  color: var(--text-0);
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 10% 20%, rgba(20,184,166,.07) 0%, transparent 45%),
    radial-gradient(ellipse at 90% 80%, rgba(167,139,250,.05) 0%, transparent 45%);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }

.container {
  max-width: 520px;
  margin: 0 auto;
  padding: 40px 20px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
  margin-bottom: 36px;
}
.header .logo {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--teal), var(--teal-dim));
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 16px;
  box-shadow: 0 8px 24px rgba(20,184,166,.25);
}
.header h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
.header p { font-size: 14px; color: var(--text-2); }

.card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow);
}

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-size: 13px;
  color: var(--text-1);
  margin-bottom: 8px;
  font-weight: 500;
}
.field input, .field textarea {
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  color: var(--text-0);
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.field textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-glow);
}

.primary-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--teal-2), var(--teal));
  color: #022c26;
  font-weight: 700;
  padding: 16px;
  border-radius: 13px;
  font-size: 15.5px;
  transition: transform .15s, box-shadow .15s;
  margin-top: 6px;
}
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(20,184,166,.3); }
.primary-btn:disabled { opacity: .6; transform: none; cursor: not-allowed; }

.err { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

/* Waiting / Status screen */
.status-card {
  text-align: center;
  padding: 20px 10px;
}
.status-icon {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--bg-2);
  border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin: 0 auto 20px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.status-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
.status-card .desc { font-size: 14px; color: var(--text-1); margin-bottom: 24px; line-height: 1.7; }
.queue-info {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-bottom: 20px;
}
.queue-info .item {
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 22px;
  min-width: 110px;
}
.queue-info .item .val {
  font-size: 28px;
  font-weight: 800;
  font-family: var(--mono);
  color: var(--teal-2);
}
.queue-info .item .lbl { font-size: 12px; color: var(--text-2); margin-top: 4px; }

/* Chat screen */
#chat-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; max-width: 100%; margin: 0; }
#chat-screen.active { display: flex; }

.chat-header {
  padding: 16px 20px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.chat-header .info .name { font-weight: 700; font-size: 15px; }
.chat-header .info .status { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.chat-header .actions { display: flex; gap: 8px; }
.call-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  background: var(--bg-2);
  transition: all .15s;
}
.call-btn:hover { background: var(--green); border-color: var(--green); }
.call-btn.active { background: var(--red); border-color: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
  50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
}

#chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
}
.bubble-row { display: flex; animation: fadeUp .2s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.bubble-row.mine { justify-content: flex-end; }
.bubble-row.theirs { justify-content: flex-start; }
.bubble-row.system { justify-content: center; }
.bubble {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14.5px;
  line-height: 1.7;
}
.bubble-row.mine .bubble {
  background: linear-gradient(135deg, var(--teal-dim), #0a5c54);
  color: #e6fffb;
  border-radius: 16px 16px 4px 16px;
}
.bubble-row.theirs .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px 16px 16px 4px;
}
.bubble-row.system .bubble {
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  font-family: var(--mono);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 6px 14px;
  max-width: 90%;
  text-align: center;
}
.bubble .time {
  font-size: 10.5px;
  opacity: .5;
  margin-top: 6px;
  font-family: var(--mono);
  text-align: end;
}
.bubble img, .bubble video { max-width: 100%; border-radius: 10px; margin-top: 8px; max-height: 240px; }
.bubble audio { margin-top: 8px; width: 220px; }

#chat-typing {
  padding: 4px 20px;
  font-size: 12px;
  color: var(--text-2);
  font-family: var(--mono);
  min-height: 20px;
}

.chat-form {
  display: flex;
  gap: 10px;
  padding: 14px 16px 20px;
  background: var(--bg-1);
  border-top: 1px solid var(--line);
  align-items: flex-end;
}
.chat-form textarea {
  flex: 1;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px 16px;
  color: var(--text-0);
  font-size: 14.5px;
  outline: none;
  resize: none;
  min-height: 48px;
  max-height: 120px;
  line-height: 1.5;
}
.chat-form textarea:focus { border-color: var(--teal); }
.icon-btn {
  width: 46px; height: 46px;
  border-radius: 13px;
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  color: var(--text-1);
  background: var(--bg-2);
  flex-shrink: 0;
  transition: all .15s;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text-0); }
.icon-btn.send {
  background: linear-gradient(135deg, var(--teal-2), var(--teal));
  border: none;
  color: #022c26;
}

/* Closed state */
.closed-banner {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  text-align: center;
  margin: 16px 20px;
}
.closed-banner h3 { font-size: 16px; margin-bottom: 8px; }
.closed-banner p { font-size: 13.5px; color: var(--text-1); line-height: 1.6; }

/* Hold music note */
.hold-note {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 16px;
  text-align: center;
}

/* Link buttons inside bubbles */
.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 600;
  text-decoration: none;
  color: #fff !important;
  transition: transform .15s, opacity .15s;
  max-width: 100%;
}
.link-btn:hover { transform: translateY(-1px); opacity: .92; }
.link-btn .icon { font-size: 16px; }
.link-btn.discord { background: #5865F2; }
.link-btn.whatsapp { background: #25D366; }
.link-btn.telegram { background: #229ED9; }
.link-btn.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.link-btn.twitter, .link-btn.x { background: #000; border: 1px solid #333; }
.link-btn.youtube { background: #FF0000; }
.link-btn.tiktok { background: #010101; border: 1px solid #333; }
.link-btn.snapchat { background: #FFFC00; color: #000 !important; }
.link-btn.facebook { background: #1877F2; }
.link-btn.generic { background: var(--teal-dim); border: 1px solid var(--teal); }

</style>
</head>
<body>

<!-- Form Screen -->
<div class="container" id="form-screen">
  <div class="header">
    <div class="logo">🎧</div>
    <h1>الدعم الفني</h1>
    <p>نحن هنا لمساعدتك. اكتب طلبك وسنتواصل معك بأسرع وقت.</p>
  </div>
  <div class="card">
    <div class="field">
      <label>اسمك</label>
      <input id="f-name" placeholder="الاسم الكامل" autocomplete="name">
    </div>
    <div class="field">
      <label>رقم التواصل (اختياري)</label>
      <input id="f-contact" placeholder="جوال أو إيميل">
    </div>
    <div class="field">
      <label>وصف المشكلة أو الطلب</label>
      <textarea id="f-subject" placeholder="اكتب تفاصيل طلبك بوضوح..."></textarea>
    </div>
    <button class="primary-btn" id="f-submit">إرسال الطلب</button>
    <div class="err" id="f-err"></div>
  </div>
</div>

<!-- Waiting / Status Screen -->
<div class="container" id="status-screen" style="display:none">
  <div class="header">
    <div class="logo">🎧</div>
    <h1>الدعم الفني</h1>
  </div>
  <div class="card status-card">
    <div class="status-icon" id="status-icon">⏳</div>
    <h2 id="status-title">طلبك قيد الانتظار</h2>
    <p class="desc" id="status-desc">سيتم التواصل معك قريباً. يمكنك البقاء في هذه الصفحة.</p>
    <div class="queue-info" id="queue-info">
      <div class="item">
        <div class="val" id="q-pos">—</div>
        <div class="lbl">دورك</div>
      </div>
      <div class="item">
        <div class="val" id="q-eta">—</div>
        <div class="lbl">الوقت المتوقع</div>
      </div>
    </div>
    <p class="hold-note" id="hold-note">يرجى عدم إغلاق الصفحة</p>
  </div>
</div>

<!-- Chat Screen -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="info">
      <div class="name" id="chat-admin-name">موظف الدعم</div>
      <div class="status" id="chat-status">متصل</div>
    </div>
    <div class="actions">
      <button class="call-btn" id="btn-call" title="اتصال صوتي">📞</button>
    </div>
  </div>
  <div id="chat-scroll"></div>
  <div id="chat-typing"></div>
  <div id="closed-area"></div>
  <form class="chat-form" id="chat-form">
    <button type="button" class="icon-btn" id="btn-attach">📎</button>
    <textarea id="chat-input" placeholder="اكتب رسالتك..." rows="1"></textarea>
    <button type="submit" class="icon-btn send">➤</button>
  </form>
</div>

<audio id="hold-music" loop preload="auto" src="/audio/hold-music.mp3"></audio>
<audio id="remote-audio" autoplay></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
let ticketId = null;
let accessToken = null;
let socket = null;
let pc = null;
let peerSocketId = null;
let localStream = null;
let currentStatus = 'waiting';

const saved = localStorage.getItem('support_ticket');
if (saved) {
  try {
    const d = JSON.parse(saved);
    ticketId = d.id;
    accessToken = d.token;
  } catch {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + (iso.includes('Z') ? '' : 'Z'));
    return d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}
function formatEta(secs) {
  if (!secs || secs < 60) return 'أقل من دقيقة';
  const m = Math.round(secs / 60);
  if (m < 60) return m + ' دقيقة';
  return Math.round(m / 60) + ' ساعة';
}

// Form submit
document.getElementById('f-submit').onclick = async () => {
  const name = document.getElementById('f-name').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  const subject = document.getElementById('f-subject').value.trim();
  const err = document.getElementById('f-err');
  err.textContent = '';
  if (!name) { err.textContent = 'الاسم مطلوب'; return; }
  if (!subject) { err.textContent = 'اكتب تفاصيل طلبك'; return; }

  const btn = document.getElementById('f-submit');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  try {
    const res = await fetch('/api/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ customerName: name, customerContact: contact, subject })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'خطأ');
    ticketId = data.id;
    accessToken = data.accessToken;
    localStorage.setItem('support_ticket', JSON.stringify({ id: ticketId, token: accessToken }));
    showStatus(data);
    connectSocket();
  } catch (e) {
    err.textContent = e.message || 'تعذر الإرسال';
  } finally {
    btn.disabled = false;
    btn.textContent = 'إرسال الطلب';
  }
};

function showStatus(data) {
  document.getElementById('form-screen').style.display = 'none';
  document.getElementById('status-screen').style.display = 'block';
  document.getElementById('chat-screen').classList.remove('active');

  currentStatus = data.status;
  updateStatusUI(data);

  // Try play hold music
  const music = document.getElementById('hold-music');
  music.volume = 0.3;
  music.play().catch(() => {});
}

function updateStatusUI(data) {
  const icon = document.getElementById('status-icon');
  const title = document.getElementById('status-title');
  const desc = document.getElementById('status-desc');
  const qInfo = document.getElementById('queue-info');

  if (data.status === 'waiting') {
    icon.textContent = '⏳';
    title.textContent = 'طلبك قيد الانتظار';
    desc.textContent = 'سيتم التواصل معك قريباً. يمكنك البقاء في هذه الصفحة.';
    qInfo.style.display = 'flex';
    document.getElementById('q-pos').textContent = data.position || '—';
    document.getElementById('q-eta').textContent = formatEta(data.etaSeconds);
    document.getElementById('hold-note').textContent = 'يرجى عدم إغلاق الصفحة';
  } else if (data.status === 'active') {
    document.getElementById('hold-music').pause();
    showChat(data);
  } else if (data.status === 'closed') {
    document.getElementById('hold-music').pause();
    icon.textContent = data.outcome === 'approved' ? '✅' : '📋';
    title.textContent = data.outcome === 'approved' ? 'تم حل طلبك' : 'تم إغلاق الطلب';
    desc.textContent = data.solution || 'شكراً لتواصلك معنا.';
    qInfo.style.display = 'none';
    document.getElementById('hold-note').textContent = '';
  }
}

function showChat(data) {
  document.getElementById('form-screen').style.display = 'none';
  document.getElementById('status-screen').style.display = 'none';
  document.getElementById('chat-screen').classList.add('active');
  document.getElementById('chat-admin-name').textContent = data.assignedAdminName || 'موظف الدعم';
  document.getElementById('chat-status').textContent = 'متصل الآن';
  if (data.status === 'closed') {
    document.getElementById('chat-form').style.display = 'none';
    document.getElementById('closed-area').innerHTML = `
      <div class="closed-banner">
        <h3>${data.outcome === 'approved' ? '✅ تم حل الطلب' : 'تم إغلاق الطلب'}</h3>
        <p>${escapeHtml(data.solution || '')}</p>
      </div>`;
  }
}

function connectSocket() {
  if (socket) return;
  socket = io();
  socket.on('connect', () => {
    if (ticketId && accessToken) {
      socket.emit('ticket:join', { ticketId, accessToken });
    }
  });
  socket.on('ticket:history', (msgs) => {
    const scroll = document.getElementById('chat-scroll');
    scroll.innerHTML = '';
    msgs.forEach(appendBubble);
    scroll.scrollTop = scroll.scrollHeight;
  });
  socket.on('ticket:message', (m) => {
    appendBubble(m);
    const scroll = document.getElementById('chat-scroll');
    scroll.scrollTop = scroll.scrollHeight;
  });
  socket.on('ticket:typing', ({ text }) => {
    document.getElementById('chat-typing').textContent = text ? '🖊️ الموظف يكتب...' : '';
  });
  socket.on('ticket:status', (data) => {
    if (!data || !data.status) return;
    currentStatus = data.status;
    console.log('status update', data.status);

    if (data.status === 'active') {
      // افتح الشات فوراً عند الزبون
      showChat(data);
      socket.emit('ticket:join', { ticketId, accessToken });
    } else if (data.status === 'closed') {
      document.getElementById('hold-music').pause();
      if (document.getElementById('chat-screen').classList.contains('active')) {
        document.getElementById('chat-form').style.display = 'none';
        document.getElementById('closed-area').innerHTML = `
          <div class="closed-banner">
            <h3>${data.outcome === 'approved' ? '✅ تم حل الطلب' : 'تم إغلاق الطلب'}</h3>
            <p>${escapeHtml(data.solution || '')}</p>
          </div>`;
      } else {
        updateStatusUI(data);
      }
    } else {
      updateStatusUI(data);
    }
  });

  // WebRTC
  socket.on('rtc:call-request', ({ fromSocketId }) => {
    peerSocketId = fromSocketId;
    // Auto show incoming on customer side could be added; for now admin initiates mostly
  });
  socket.on('rtc:offer', async ({ fromSocketId, sdp }) => {
    peerSocketId = fromSocketId;
    await ensurePC();
    await pc.setRemoteDescription(sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('rtc:answer', { toSocketId: fromSocketId, sdp: answer });
    document.getElementById('btn-call').classList.add('active');
  });
  socket.on('rtc:answer', async ({ sdp }) => { await pc?.setRemoteDescription(sdp); });
  socket.on('rtc:ice', async ({ candidate }) => { try { await pc?.addIceCandidate(candidate); } catch {} });
  socket.on('rtc:call-end', endCall);
}

function renderContentWithLinks(text) {
  if (!text) return '';
  // Detect URLs
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  const parts = text.split(urlRegex);
  return parts.map(part => {
    if (/^https?:\/\//.test(part)) {
      const url = part;
      const lower = url.toLowerCase();
      let cls = 'generic';
      let icon = '🔗';
      let label = 'فتح الرابط';

      if (lower.includes('discord.gg') || lower.includes('discord.com')) {
        cls = 'discord'; icon = '💬'; label = 'انضم لديسكورد';
      } else if (lower.includes('wa.me') || lower.includes('whatsapp.com') || lower.includes('api.whatsapp.com')) {
        cls = 'whatsapp'; icon = '🟢'; label = 'واتساب';
      } else if (lower.includes('t.me') || lower.includes('telegram.')) {
        cls = 'telegram'; icon = '✈️'; label = 'تيليجرام';
      } else if (lower.includes('instagram.com') || lower.includes('instagr.am')) {
        cls = 'instagram'; icon = '📷'; label = 'إنستقرام';
      } else if (lower.includes('twitter.com') || lower.includes('x.com')) {
        cls = 'x'; icon = '𝕏'; label = 'تويتر / X';
      } else if (lower.includes('youtube.com') || lower.includes('youtu.be')) {
        cls = 'youtube'; icon = '▶️'; label = 'يوتيوب';
      } else if (lower.includes('tiktok.com')) {
        cls = 'tiktok'; icon = '🎵'; label = 'تيك توك';
      } else if (lower.includes('snapchat.com') || lower.includes('snapchat.com/add')) {
        cls = 'snapchat'; icon = '👻'; label = 'سناب شات';
      } else if (lower.includes('facebook.com') || lower.includes('fb.com') || lower.includes('fb.me')) {
        cls = 'facebook'; icon = '👤'; label = 'فيسبوك';
      }

      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-btn ${cls}"><span class="icon">${icon}</span> ${label}</a>`;
    }
    return escapeHtml(part).replace(/\n/g, '<br>');
  }).join('');
}

function appendBubble(m) {
  const scroll = document.getElementById('chat-scroll');
  if (!scroll) return;
  const row = document.createElement('div');
  let cls = 'system';
  if (m.sender_type === 'customer') cls = 'mine';
  else if (m.sender_type === 'admin') cls = 'theirs';
  row.className = 'bubble-row ' + cls;

  let media = '';
  if (m.attachment_url) {
    if (m.attachment_type === 'image') media = `<img src="${m.attachment_url}" alt="">`;
    else if (m.attachment_type === 'video') media = `<video src="${m.attachment_url}" controls></video>`;
    else if (m.attachment_type === 'audio') media = `<audio src="${m.attachment_url}" controls></audio>`;
  }

  const body = m.content ? renderContentWithLinks(m.content) : '';
  row.innerHTML = `<div class="bubble">
    ${body}
    ${media}
    <div class="time">${formatTime(m.created_at)}</div>
  </div>`;
  scroll.appendChild(row);
}

// Chat form
document.getElementById('chat-form').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const content = input.value.trim();
  if (!content || !ticketId) return;
  socket.emit('ticket:message', { ticketId, content });
  input.value = '';
  input.style.height = 'auto';
};
document.getElementById('chat-input').oninput = function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  if (socket && ticketId) socket.emit('ticket:typing', { ticketId, text: this.value.slice(0, 60) });
};
document.getElementById('chat-input').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('chat-form').requestSubmit();
  }
};

// Attach
document.getElementById('btn-attach').onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,video/*,audio/*';
  inp.onchange = async () => {
    if (!inp.files[0] || !ticketId) return;
    const fd = new FormData();
    fd.append('file', inp.files[0]);
    try {
      const res = await fetch(`/api/upload?ticketId=${ticketId}&token=${accessToken}`, { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      socket.emit('ticket:message', { ticketId, content: '', attachmentUrl: data.url, attachmentType: data.type });
    } catch (e) { alert(e.message); }
  };
  inp.click();
};

// Call button (customer can also initiate)
document.getElementById('btn-call').onclick = async () => {
  if (pc) { endCall(); return; }
  document.getElementById('btn-call').classList.add('active');
  await ensurePC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('rtc:call-request', { ticketId });
  // The other side will receive and answer
};

async function ensurePC() {
  if (pc) return pc;
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  });
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = (e) => {
    document.getElementById('remote-audio').srcObject = e.streams[0];
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && peerSocketId) {
      socket.emit('rtc:ice', { toSocketId: peerSocketId, candidate: e.candidate });
    }
  };
  return pc;
}

function endCall() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.getElementById('btn-call').classList.remove('active');
  if (ticketId) socket?.emit('rtc:call-end', { ticketId });
  peerSocketId = null;
}

// Resume existing ticket
if (ticketId && accessToken) {
  fetch(`/api/tickets/${ticketId}/status?token=${accessToken}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        localStorage.removeItem('support_ticket');
        return;
      }
      if (data.status === 'waiting') {
        showStatus(data);
        connectSocket();
      } else if (data.status === 'active' || data.status === 'closed') {
        showChat(data);
        connectSocket();
        if (data.status === 'active') {
          // load messages via socket
        }
      }
    })
    .catch(() => {});
}
