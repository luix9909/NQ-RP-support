<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الدعم الفني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #060d14;
  --bg-1: #0b1520;
  --bg-2: #12202e;
  --bg-3: #1a2d3f;
  --line: #1e3348;
  --line-2: #2a455c;
  --teal: #14b8a6;
  --teal-2: #5eead4;
  --teal-dim: #0d6b62;
  --teal-glow: rgba(20,184,166,.15);
  --text-0: #f0f7fa;
  --text-1: #a8c0cc;
  --text-2: #6b8a99;
  --red: #ef4444;
  --green: #22c55e;
  --amber: #eab308;
  --purple: #a78bfa;
  --font: 'Cairo', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg-0);
  color: var(--text-0);
  overflow: hidden;
  background-image: radial-gradient(ellipse at 20% 0%, rgba(20,184,166,.06) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 100%, rgba(167,139,250,.04) 0%, transparent 50%);
}
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; }

/* ========== LOGIN ========== */
#login-screen {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  width: 420px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 40px 36px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--teal), var(--purple));
}
.login-card h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.login-card p { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: var(--text-1); margin-bottom: 8px; font-weight: 500; }
.field input {
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 14px 16px;
  color: var(--text-0);
  font-size: 15px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.field input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-glow); }
.primary-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--teal-2), var(--teal));
  color: #022c26;
  font-weight: 700;
  padding: 15px;
  border-radius: 12px;
  font-size: 15px;
  margin-top: 8px;
  transition: transform .15s, box-shadow .15s;
}
.primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(20,184,166,.3); }
.err { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* ========== DASHBOARD ========== */
#dash { height: 100vh; display: none; grid-template-columns: 240px 1fr; }
#dash.active { display: grid; }

#nav {
  background: var(--bg-1);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 22px 14px;
}
#nav .brand {
  font-weight: 900;
  font-size: 16px;
  padding: 0 10px 22px;
  display: flex;
  align-items: center;
  gap: 10px;
}
#nav .brand span {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--teal), var(--teal-dim));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 11px;
  font-size: 14px;
  color: var(--text-1);
  margin-bottom: 4px;
  transition: all .15s;
  font-weight: 500;
}
.nav-btn:hover { background: var(--bg-2); color: var(--text-0); }
.nav-btn.active {
  background: var(--teal-glow);
  color: var(--teal-2);
  font-weight: 600;
}
.nav-badge {
  margin-inline-start: auto;
  background: var(--teal);
  color: #022;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  min-width: 22px;
  text-align: center;
}
#nav .spacer { flex: 1; }
#nav .me {
  font-size: 12.5px;
  color: var(--text-2);
  padding: 14px 12px;
  border-top: 1px solid var(--line);
  margin-top: 10px;
}
#nav .me b { color: var(--text-0); display: block; font-size: 14px; margin-bottom: 2px; }
#logout-btn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--text-2);
  transition: all .15s;
}
#logout-btn:hover { border-color: var(--red); color: var(--red); background: rgba(239,68,68,.08); }

#main { display: flex; flex-direction: column; overflow: hidden; }
#content { flex: 1; overflow-y: auto; padding: 28px 32px; }

.page-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Ticket rows */
.ticket-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 10px;
  cursor: pointer;
  transition: all .18s;
}
.ticket-row:hover {
  border-color: var(--line-2);
  background: var(--bg-2);
  transform: translateX(-3px);
}
.ticket-row .num {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--teal-2);
  min-width: 42px;
}
.ticket-row .main { flex: 1; min-width: 0; }
.ticket-row .name { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
.ticket-row .subject { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge {
  font-size: 11.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.badge.waiting { background: rgba(234,179,8,.12); color: var(--amber); }
.badge.active { background: rgba(20,184,166,.12); color: var(--teal-2); }
.badge.closed { background: rgba(107,138,153,.12); color: var(--text-2); }
.tiny-btn {
  padding: 7px 14px;
  border-radius: 9px;
  border: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 600;
  transition: all .15s;
}
.tiny-btn:hover { background: var(--bg-3); }

.empty-note {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-2);
  font-size: 14.5px;
}

/* Stats cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.stat-card .label { font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
.stat-card .value { font-size: 28px; font-weight: 800; font-family: var(--mono); color: var(--teal-2); }

/* ========== TICKET MODAL (BIG & BEAUTIFUL) ========== */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(3, 8, 14, .82);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.ticket-modal {
  width: 780px;
  max-width: 96vw;
  height: 88vh;
  max-height: 900px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,.5);
  animation: modalIn .25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.96) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.tm-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background: var(--bg-2);
}
.tm-head .name { font-size: 17px; font-weight: 800; }
.tm-head .subject { font-size: 13px; color: var(--text-1); margin-top: 4px; max-width: 420px; }
.tm-head .meta { font-size: 12px; color: var(--text-2); margin-top: 6px; font-family: var(--mono); }
.tm-head .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.action-btn {
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
  background: var(--bg-1);
}
.action-btn:hover { background: var(--bg-3); border-color: var(--line-2); }
.action-btn.primary { background: var(--teal-dim); border-color: var(--teal); color: var(--teal-2); }
.action-btn.danger { border-color: rgba(239,68,68,.4); color: var(--red); }
.action-btn.danger:hover { background: rgba(239,68,68,.1); }
.action-btn.auto-on { background: rgba(167,139,250,.15); border-color: var(--purple); color: var(--purple); }
.call-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: all .15s;
  background: var(--bg-1);
}
.call-btn:hover { background: var(--green); border-color: var(--green); }
.call-btn.active { background: var(--red); border-color: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
  50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
}
.modal-close {
  width: 34px; height: 34px;
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.modal-close:hover { background: rgba(239,68,68,.1); border-color: var(--red); color: var(--red); }

/* Chat area */
#tm-chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
}
.bubble-row { display: flex; animation: fadeUp .12s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
.bubble-row.mine { justify-content: flex-end; }
.bubble-row.theirs { justify-content: flex-start; }
.bubble-row.system { justify-content: center; }
.bubble {
  max-width: 72%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
  position: relative;
}
.bubble-row.mine .bubble {
  background: linear-gradient(135deg, var(--teal-dim), #0a5c54);
  color: #e6fffb;
  border-radius: 16px 16px 4px 16px;
  box-shadow: 0 2px 12px rgba(20,184,166,.15);
}
.bubble-row.theirs .bubble {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px 16px 16px 4px;
}
.bubble-row.system .bubble {
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  font-family: var(--mono);
  max-width: 90%;
  text-align: center;
  padding: 6px 12px;
  border: 1px dashed var(--line);
  border-radius: 8px;
}
.bubble .sender {
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 4px;
  opacity: .7;
}
.bubble .time {
  font-size: 10.5px;
  opacity: .5;
  margin-top: 6px;
  font-family: var(--mono);
  text-align: end;
}
.bubble img, .bubble video {
  max-width: 100%;
  border-radius: 10px;
  display: block;
  margin-top: 8px;
  max-height: 280px;
}
.bubble audio { margin-top: 8px; width: 240px; }

#tm-typing {
  padding: 6px 28px;
  font-size: 12px;
  color: var(--text-2);
  font-family: var(--mono);
  min-height: 22px;
}

/* Input area */
#tm-chat-form {
  display: flex;
  gap: 10px;
  padding: 14px 20px 18px;
  border-top: 1px solid var(--line);
  background: var(--bg-2);
  align-items: flex-end;
}
#tm-chat-input {
  flex: 1;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px 16px;
  color: var(--text-0);
  font-size: 14.5px;
  outline: none;
  resize: none;
  min-height: 48px;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color .2s;
}
#tm-chat-input:focus { border-color: var(--teal); }
.icon-btn {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  color: var(--text-1);
  background: var(--bg-1);
  transition: all .15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg-3); color: var(--text-0); }
.icon-btn.send {
  background: linear-gradient(135deg, var(--teal-2), var(--teal));
  border: none;
  color: #022c26;
}
.icon-btn.send:hover { transform: scale(1.05); }

/* Commands hint */
.cmd-hint {
  padding: 6px 20px 0;
  font-size: 11.5px;
  color: var(--text-2);
  font-family: var(--mono);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.cmd-hint span {
  background: var(--bg-0);
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: all .15s;
}
.cmd-hint span:hover { border-color: var(--teal); color: var(--teal-2); }

/* Incoming call overlay */
#call-overlay {
  position: fixed;
  inset: 0;
  background: rgba(3,8,14,.9);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
}
#call-overlay .ring {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green), #15803d);
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  animation: pulse 1.2s infinite;
}
#call-overlay .btns { display: flex; gap: 20px; }
#call-overlay button {
  width: 64px; height: 64px;
  border-radius: 50%;
  font-size: 24px;
  display: flex; align-items: center; justify-content: center;
}
#call-overlay .accept { background: var(--green); }
#call-overlay .decline { background: var(--red); }

/* Toast */
#toast-wrap {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}
.toast {
  background: var(--bg-2);
  border: 1px solid var(--line);
  padding: 12px 22px;
  border-radius: 12px;
  font-size: 13.5px;
  box-shadow: var(--shadow);
  animation: fadeUp .25s ease;
}

/* Search */
.search-row { margin-bottom: 18px; }
.search-row input {
  width: 100%;
  max-width: 360px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px 16px;
  color: var(--text-0);
  font-size: 14px;
  outline: none;
}
.search-row input:focus { border-color: var(--teal); }

/* Employees */
.emp-form {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto;
  gap: 12px;
  margin-bottom: 24px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
}
.emp-form input {
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--text-0);
  font-size: 13.5px;
  outline: none;
}
.emp-form input:focus { border-color: var(--teal); }
.emp-list .ticket-row { cursor: default; }
.emp-list .ticket-row:hover { transform: none; }

/* Responsive */
@media (max-width: 700px) {
  #dash { grid-template-columns: 1fr; }
  #nav { display: none; }
  .ticket-modal { height: 95vh; border-radius: 12px; }
  .emp-form { grid-template-columns: 1fr; }
}

/* Link buttons inside bubbles */
.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 600;
  text-decoration: none;
  color: #fff !important;
  transition: transform .15s, opacity .15s;
  max-width: 100%;
}
.link-btn:hover { transform: translateY(-1px); opacity: .92; }
.link-btn .icon { font-size: 16px; }
.link-btn.discord { background: #5865F2; }
.link-btn.whatsapp { background: #25D366; }
.link-btn.telegram { background: #229ED9; }
.link-btn.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.link-btn.twitter, .link-btn.x { background: #000; border: 1px solid #333; }
.link-btn.youtube { background: #FF0000; }
.link-btn.tiktok { background: #010101; border: 1px solid #333; }
.link-btn.snapchat { background: #FFFC00; color: #000 !important; }
.link-btn.facebook { background: #1877F2; }
.link-btn.generic { background: var(--teal-dim); border: 1px solid var(--teal); }

</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>لوحة الدعم الفني</h1>
    <p>تسجيل دخول الموظفين والإدارة</p>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="li-email" type="email" placeholder="name@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="primary-btn" id="li-submit">دخول</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<div id="dash">
  <nav id="nav">
    <div class="brand"><span>🎧</span> الدعم الفني</div>
    <button class="nav-btn active" data-tab="queue">الطابور <span class="nav-badge hidden" id="badge-queue">0</span></button>
    <button class="nav-btn" data-tab="active">نشط الآن</button>
    <button class="nav-btn" data-tab="archive">الأرشيف</button>
    <button class="nav-btn" data-tab="stats">الإحصائيات</button>
    <button class="nav-btn hidden" data-tab="employees" id="nav-employees">الموظفون</button>
    <div class="spacer"></div>
    <div class="me">مسجل كـ <b id="me-name">—</b></div>
    <button id="logout-btn">خروج</button>
  </nav>
  <div id="main">
    <div id="content"></div>
  </div>
</div>

<div id="toast-wrap"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
let token = localStorage.getItem('support_admin_token') || null;
let me = null;
let socket = null;
let currentTab = 'queue';
let openTicketId = null;
let pc = null;
let peerSocketId = null;
let localStream = null;

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + (iso.includes('Z') ? '' : 'Z'));
    return d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'خطأ');
  return data;
}

// Login
document.getElementById('li-submit').onclick = async () => {
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-pass').value;
  const err = document.getElementById('li-err');
  err.textContent = '';
  if (!email || !password) { err.textContent = 'أدخل الإيميل وكلمة المرور'; return; }
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error; return; }
    token = data.token;
    me = data.admin;
    localStorage.setItem('support_admin_token', token);
    enterDash();
  } catch (e) {
    err.textContent = 'تعذر الاتصال بالسيرفر';
  }
};

async function tryAutoLogin() {

function enterDash() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dash').classList.add('active');
  document.getElementById('me-name').textContent = me.name + (me.role === 'owner' ? ' (المالك)' : '');
  if (me.role === 'owner') document.getElementById('nav-employees').classList.remove('hidden');

  socket = io({ auth: { adminToken: token } });
  socket.on('connect', () => {
    socket.emit('admin:watch-queue');
    // re-join open ticket if any after reconnect
    if (openTicketId) socket.emit('ticket:join', { ticketId: openTicketId });
  });
  socket.on('queue:update', () => {
    // دائماً حدث الشارة + أعد رسم التبويب الحالي فوراً
    updateQueueBadge();
    if (['queue', 'active', 'stats'].includes(currentTab)) renderTab();
  });
  socket.on('ticket:history', (msgs) => {
    if (openTicketId) {
      const scroll = document.getElementById('tm-chat-scroll');
      if (scroll) {
        scroll.innerHTML = '';
        msgs.forEach(appendBubble);
        scrollChat();
      }
    }
  });
  socket.on('ticket:message', (m) => {
    if (openTicketId && Number(openTicketId) === Number(m.ticket_id)) {
      appendBubble(m);
      scrollChat();
    }
    // لو الرسالة جديدة على طلب بالانتظار، حدث الطابور
    if (currentTab === 'queue' || currentTab === 'active') {
      updateQueueBadge();
    }
  });
  socket.on('ticket:typing', ({ text }) => {
    const el = document.getElementById('tm-typing');
    if (el) el.textContent = text ? ('🖊️ يكتب الآن: ' + text) : '';
  });
  socket.on('ticket:status', (data) => {
    if (openTicketId && data && Number(data.id) === Number(openTicketId)) {
      // تحديث خفيف للحالة بدون إعادة فتح المودال
    }
    updateQueueBadge();
    if (['queue', 'active', 'stats'].includes(currentTab)) renderTab();
  });

  // WebRTC
  socket.on('rtc:call-request', ({ fromSocketId }) => showIncomingCall(fromSocketId));
  socket.on('rtc:offer', async ({ fromSocketId, sdp }) => {
    peerSocketId = fromSocketId;
    await ensurePC();
    await pc.setRemoteDescription(sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit('rtc:answer', { toSocketId: fromSocketId, sdp: answer });
  });
  socket.on('rtc:answer', async ({ sdp }) => { await pc?.setRemoteDescription(sdp); });
  socket.on('rtc:ice', async ({ candidate }) => { try { await pc?.addIceCandidate(candidate); } catch {} });
  socket.on('rtc:call-end', endCall);
  socket.on('rtc:call-decline', () => { endCall(); toast('تم رفض الاتصال'); });

  document.querySelectorAll('.nav-btn[data-tab]').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderTab();
    };
  });
  renderTab();
}

async function openTicket(id) {
  openTicketId = Number(id);
  const t = await api('/api/admin/tickets/' + id);
  const isAuto = t.autoMode;

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'ticket-modal-bg';
  modal.innerHTML = `
    <div class="ticket-modal">
      <div class="tm-head">
        <div>
          <div class="name">${escapeHtml(t.customer_name)} <span style="font-family:var(--mono);color:var(--text-2);font-size:13px;font-weight:500">#${t.id}</span></div>
          <div class="subject">${escapeHtml(t.subject)}</div>
          <div class="meta">${t.status === 'active' ? '🟢 نشط' : t.status === 'waiting' ? '🟡 بالانتظار' : '⚪ مغلق'} ${t.assigned_admin_name ? '• ' + escapeHtml(t.assigned_admin_name) : ''}</div>
        </div>
        <div class="actions">
          ${t.status === 'active' ? `
            <button class="action-btn ${isAuto ? 'auto-on' : ''}" id="btn-auto">${isAuto ? '🤖 AI مفعّل' : '🤖 تفعيل AI'}</button>
            <button class="call-btn" id="btn-call" title="اتصال صوتي">📞</button>
            <button class="action-btn primary" id="btn-close-ok">✅ موافقة</button>
            <button class="action-btn danger" id="btn-close-no">❌ رفض</button>
          ` : ''}
          <button class="modal-close" id="btn-modal-close">✕</button>
        </div>
      </div>
      <div id="tm-chat-scroll"></div>
      <div id="tm-typing"></div>
      <div class="cmd-hint">
        <span data-cmd="/auto">/auto</span>
        <span data-cmd="/wait">/wait</span>
        <span data-cmd="/close approved">/close approved</span>
        <span data-cmd="/close rejected">/close rejected</span>
        <span data-cmd="/help">/help</span>
      </div>
      <form id="tm-chat-form">
        <button type="button" class="icon-btn" id="btn-attach" title="إرفاق ملف">📎</button>
        <textarea id="tm-chat-input" placeholder="اكتب رسالة... أو استخدم / للأوامر" rows="1"></textarea>
        <button type="submit" class="icon-btn send">➤</button>
      </form>
    </div>`;
  document.body.appendChild(modal);

  socket.emit('ticket:join', { ticketId: id });

  document.getElementById('btn-modal-close').onclick = () => {
    openTicketId = null;
    modal.remove();
    endCall();
  };
  modal.onclick = (e) => { if (e.target === modal) { openTicketId = null; modal.remove(); endCall(); } };

  // Commands chips
  modal.querySelectorAll('.cmd-hint span').forEach(s => {
    s.onclick = () => {
      const input = document.getElementById('tm-chat-input');
      input.value = s.dataset.cmd;
      input.focus();
    };
  });

  // Auto toggle
  const autoBtn = document.getElementById('btn-auto');
  if (autoBtn) {
    autoBtn.onclick = () => {
      socket.emit('ticket:message', {
        ticketId: id,
        content: isAuto ? '/auto off' : '/auto'
      });
      setTimeout(() => { modal.remove(); openTicket(id); }, 300);
    };
  }

  // Close buttons
  const closeOk = document.getElementById('btn-close-ok');
  const closeNo = document.getElementById('btn-close-no');
  if (closeOk) closeOk.onclick = async () => {
    const solution = prompt('ملخص الحل (اختياري):') || 'تم حل المشكلة';
    await api('/api/admin/tickets/' + id + '/close', { method: 'POST', body: JSON.stringify({ outcome: 'approved', solution }) });
    toast('تم الإغلاق بالموافقة');
    modal.remove();
    openTicketId = null;
    renderTab();
  };
  if (closeNo) closeNo.onclick = async () => {
    const solution = prompt('سبب الرفض (اختياري):') || '';
    await api('/api/admin/tickets/' + id + '/close', { method: 'POST', body: JSON.stringify({ outcome: 'rejected', solution }) });
    toast('تم الإغلاق بالرفض');
    modal.remove();
    openTicketId = null;
    renderTab();
  };

  // Call
  const callBtn = document.getElementById('btn-call');
  if (callBtn) {
    callBtn.onclick = async () => {
      if (pc) { endCall(); return; }
      callBtn.classList.add('active');
      await ensurePC();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('rtc:call-request', { ticketId: id });
      socket.emit('rtc:offer', { toSocketId: peerSocketId, sdp: offer });
    };
  }

  // Attach
  document.getElementById('btn-attach').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*,video/*,audio/*';
    inp.onchange = async () => {
      if (!inp.files[0]) return;
      const fd = new FormData();
      fd.append('file', inp.files[0]);
      try {
        const res = await fetch('/api/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        socket.emit('ticket:message', { ticketId: id, content: '', attachmentUrl: data.url, attachmentType: data.type });
      } catch (e) { toast(e.message); }
    };
    inp.click();
  };

  // Send message
  const form = document.getElementById('tm-chat-form');
  const input = document.getElementById('tm-chat-input');
  form.onsubmit = (e) => {
    e.preventDefault();
    const content = input.value.trim();
    if (!content) return;
    socket.emit('ticket:message', { ticketId: id, content });
    input.value = '';
    input.style.height = 'auto';
  };
  input.oninput = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    socket.emit('ticket:typing', { ticketId: id, text: input.value.slice(0, 80) });
  };
  input.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  };
}

function renderContentWithLinks(text) {
  if (!text) return '';
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  const parts = text.split(urlRegex);
  return parts.map(part => {
    if (/^https?:\/\//.test(part)) {
      const url = part;
      const lower = url.toLowerCase();
      let cls = 'generic', icon = '🔗', label = 'فتح الرابط';
      if (lower.includes('discord.gg') || lower.includes('discord.com')) { cls='discord'; icon='💬'; label='انضم لديسكورد'; }
      else if (lower.includes('wa.me') || lower.includes('whatsapp.com') || lower.includes('api.whatsapp.com')) { cls='whatsapp'; icon='🟢'; label='واتساب'; }
      else if (lower.includes('t.me') || lower.includes('telegram.')) { cls='telegram'; icon='✈️'; label='تيليجرام'; }
      else if (lower.includes('instagram.com') || lower.includes('instagr.am')) { cls='instagram'; icon='📷'; label='إنستقرام'; }
      else if (lower.includes('twitter.com') || lower.includes('x.com')) { cls='x'; icon='𝕏'; label='تويتر / X'; }
      else if (lower.includes('youtube.com') || lower.includes('youtu.be')) { cls='youtube'; icon='▶️'; label='يوتيوب'; }
      else if (lower.includes('tiktok.com')) { cls='tiktok'; icon='🎵'; label='تيك توك'; }
      else if (lower.includes('snapchat.com')) { cls='snapchat'; icon='👻'; label='سناب شات'; }
      else if (lower.includes('facebook.com') || lower.includes('fb.com') || lower.includes('fb.me')) { cls='facebook'; icon='👤'; label='فيسبوك'; }
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="link-btn ${cls}"><span class="icon">${icon}</span> ${label}</a>`;
    }
    return escapeHtml(part).replace(/\n/g, '<br>');
  }).join('');
}

function appendBubble(m) {
  const scroll = document.getElementById('tm-chat-scroll');
  if (!scroll) return;
  const row = document.createElement('div');
  let cls = 'system';
  if (m.sender_type === 'admin') cls = 'mine';
  else if (m.sender_type === 'customer') cls = 'theirs';
  row.className = 'bubble-row ' + cls;

  let media = '';
  if (m.attachment_url) {
    if (m.attachment_type === 'image') media = `<img src="${m.attachment_url}" alt="صورة">`;
    else if (m.attachment_type === 'video') media = `<video src="${m.attachment_url}" controls></video>`;
    else if (m.attachment_type === 'audio') media = `<audio src="${m.attachment_url}" controls></audio>`;
  }

  const showSender = m.sender_type !== 'system' && (m.sender_type === 'admin' || m.sender_type === 'customer');
  const body = m.content ? renderContentWithLinks(m.content) : '';
  row.innerHTML = `<div class="bubble">
    ${showSender ? `<div class="sender">${escapeHtml(m.sender_name)}</div>` : ''}
    ${body}
    ${media}
    <div class="time">${formatTime(m.created_at)}</div>
  </div>`;
  scroll.appendChild(row);
}

// WebRTC helpers
async function ensurePC() {
  if (pc) return pc;
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      {
        urls: 'turn:openrelay.metered.ca:80',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      },
      {
        urls: 'turn:openrelay.metered.ca:443',
        username: 'openrelayproject',
        credential: 'openrelayproject'
      }
    ]
  });
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  pc.ontrack = (e) => {
    let audio = document.getElementById('remote-audio');
    if (!audio) {
      audio = document.createElement('audio');
      audio.id = 'remote-audio';
      audio.autoplay = true;
      document.body.appendChild(audio);
    }
    audio.srcObject = e.streams[0];
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && peerSocketId) {
      socket.emit('rtc:ice', { toSocketId: peerSocketId, candidate: e.candidate });
    }
  };
  return pc;
}

function showIncomingCall(fromSocketId) {
  peerSocketId = fromSocketId;
  const overlay = document.createElement('div');
  overlay.id = 'call-overlay';
  overlay.innerHTML = `
    <div class="ring">📞</div>
    <div style="font-size:18px;font-weight:700">مكالمة واردة</div>
    <div class="btns">
      <button class="accept">✓</button>
      <button class="decline">✕</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('.accept').onclick = async () => {
    overlay.remove();
    await ensurePC();
    socket.emit('rtc:call-accept', { toSocketId: fromSocketId });
    const callBtn = document.getElementById('btn-call');
    if (callBtn) callBtn.classList.add('active');
  };
  overlay.querySelector('.decline').onclick = () => {
    socket.emit('rtc:call-decline', { toSocketId: fromSocketId });
    overlay.remove();
    peerSocketId = null;
  };
}

function endCall() {
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  const audio = document.getElementById('remote-audio');
  if (audio) audio.remove();
  const callBtn = document.getElementById('btn-call');
  if (callBtn) callBtn.classList.remove('active');
  const overlay = document.getElementById('call-overlay');
  if (overlay) overlay.remove();
  if (openTicketId) socket.emit('rtc:call-end', { ticketId: openTicketId });
  peerSocketId = null;
}

tryAutoLogin();
</script>
</body>
